name: Docker CI Workflow

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      file:
        required: true
        type: string
      context:
        required: true
        type: string
      platforms:
        required: true
        type: string
      labels:
        required: false
        type: string
      image-tag:
        description: "Override the published image tag. Empty uses the ref-based formula."
        required: false
        type: string
        default: ""
      image-repository:
        description: "Full image name without tag, e.g. ghcr.io/netcracker/qubership-apihub-backend. Empty uses ghcr.io/netcracker/<name>."
        required: false
        type: string
        default: ""
    secrets:
      NPMRC:
        required: false
      GH_ACCESS_TOKEN:
        required: false
    outputs:
      image_tag:
        description: "Docker image tag of the published image."
        value: ${{ jobs.build_and_push_image.outputs.image_tag }}
      image_repository:
        description: "Docker image repository without tag."
        value: ${{ jobs.build_and_push_image.outputs.image_repository }}

env:
  REF_NAME: ${{ github.ref }}

jobs:
  build_and_push_image:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.prepare_tag.outputs.TAG }}
      image_repository: ${{ steps.prepare_tag.outputs.IMAGE_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${GITHUB_ACTOR}
          password: ${{secrets.GITHUB_TOKEN}}
      - name: Prepare Tag
        id: prepare_tag
        run: |
          if [ -n "${{ inputs.image-tag }}" ]; then
            TAG="${{ inputs.image-tag }}"
          else
            TAG=$(echo ${REF_NAME} | sed 's@refs/tags/@@;s@refs/heads/@@;s@refs/pull/@pull/@;s@^develop$@dev@;s@^release$@next@;s@/@-@g;')
          fi
          if [ -n "${{ inputs.image-repository }}" ]; then
            IMAGE_REPOSITORY="${{ inputs.image-repository }}"
          else
            IMAGE_REPOSITORY="ghcr.io/netcracker/${{ inputs.name }}"
          fi
          echo "TAG=$TAG"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> $GITHUB_OUTPUT
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: |
          shortSha=$(git rev-parse --short ${{ github.sha }})
          echo "GIT_HASH=$shortSha" >> $GITHUB_OUTPUT
          echo "GIT_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          no-cache: true
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.prepare_tag.outputs.IMAGE_REPOSITORY }}:${{ steps.prepare_tag.outputs.TAG }}
          provenance: false
          build-args: |
            GH_ACCESS_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
            TAG=${{ steps.prepare_tag.outputs.TAG }}
            GIT_HASH=${{ steps.extract_branch.outputs.GIT_HASH }}
            GIT_BRANCH=${{ steps.extract_branch.outputs.GIT_BRANCH }}
          labels: ${{ inputs.labels }}
          secrets: |
            "npmrc=${{ secrets.NPMRC }}"
